<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panther Corridors: A Wildlife Biologist's Field Simulation (Preview)</title>
<style>
/* ============================================================
   Panther Corridors GIS Field Simulation — Stylesheet
   Palette: Le Moyne Green #19422E · Le Moyne Gold #CFB53B
   Type: Georgia (display) / Calibri stack (body)
   ============================================================ */

:root {
  --green-900: #12301F;
  --green-700: #19422E;
  --green-500: #2B6349;
  --green-100: #E4EDE6;
  --gold-600: #B99A2E;
  --gold-500: #CFB53B;
  --gold-200: #F0E4B8;
  --parchment: #F2EEE1;
  --parchment-dark: #E9E2CE;
  --ink: #232821;
  --ink-soft: #4B5245;
  --water: #2B5266;
  --water-light: #DCE9EE;
  --clay: #A6502E;
  --clay-light: #F4E0D5;
  --line: #CBC2A4;
  --radius-s: 3px;
  --radius-m: 5px;
  --shadow-card: 0 1px 0 rgba(35,40,33,0.06), 0 6px 16px rgba(35,40,33,0.08);
  --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  --sans: Calibri, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--parchment);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
}

body {
  background-image:
    radial-gradient(circle at 18% 8%, rgba(25,66,46,0.05), transparent 40%),
    repeating-linear-gradient(0deg, transparent, transparent 79px, rgba(25,66,46,0.05) 80px),
    repeating-linear-gradient(90deg, transparent, transparent 79px, rgba(25,66,46,0.035) 80px);
}

h1, h2, h3, h4 {
  font-family: var(--serif);
  color: var(--green-900);
  margin: 0 0 0.5em 0;
  font-weight: 700;
  line-height: 1.2;
}

h1 { font-size: 1.9rem; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.15rem; }

p { margin: 0 0 0.9em 0; max-width: 68ch; }

a { color: var(--water); }

button { font-family: var(--sans); cursor: pointer; }

::selection { background: var(--gold-200); }

/* ---------- Shell layout ---------- */

.app-shell {
  display: grid;
  grid-template-columns: 250px 1fr;
  min-height: 100vh;
}

.preview-banner {
  grid-column: 1 / -1;
  background: var(--clay);
  color: #fff;
  font-size: 0.85rem;
  text-align: center;
  padding: 6px 12px;
  letter-spacing: 0.01em;
}

/* ---------- Trail rail (nav) ---------- */

.trail-rail {
  background: var(--green-900);
  color: var(--parchment);
  padding: 26px 0 20px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.trail-brand {
  padding: 0 20px 18px;
  border-bottom: 1px solid rgba(240,228,184,0.18);
  margin-bottom: 6px;
}

.trail-brand .compass {
  width: 34px; height: 34px;
  margin-bottom: 8px;
}

.trail-brand .title {
  font-family: var(--serif);
  font-size: 1.05rem;
  color: var(--gold-500);
  line-height: 1.25;
}

.trail-brand .subtitle {
  font-size: 0.72rem;
  color: rgba(242,238,225,0.65);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 4px;
}

.trail-list {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
}

.trail-item {
  position: relative;
  padding: 10px 20px 10px 44px;
  font-size: 0.87rem;
  color: rgba(242,238,225,0.55);
  cursor: default;
  border-left: 3px solid transparent;
}

.trail-item .pin {
  position: absolute;
  left: 16px;
  top: 10px;
  width: 18px;
  height: 18px;
}

.trail-item.is-unlocked { color: rgba(242,238,225,0.85); cursor: pointer; }
.trail-item.is-unlocked:hover { background: rgba(255,255,255,0.05); }
.trail-item.is-current {
  color: var(--gold-500);
  border-left-color: var(--gold-500);
  background: rgba(207,181,59,0.08);
  font-weight: 600;
}
.trail-item.is-done .pin-dot { background: var(--gold-500); }

.trail-item .stage-label {
  display: block;
  font-size: 0.63rem;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: rgba(242,238,225,0.4);
  margin-bottom: 1px;
}

.pin-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: rgba(242,238,225,0.3);
  display: inline-block;
}

.rail-footer {
  padding: 16px 20px 0;
  margin-top: 14px;
  border-top: 1px solid rgba(240,228,184,0.18);
  font-size: 0.72rem;
  color: rgba(242,238,225,0.45);
}

/* ---------- Main column ---------- */

.main-col {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.progress-strip {
  background: var(--parchment-dark);
  border-bottom: 1px solid var(--line);
  padding: 10px 36px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 0.78rem;
  color: var(--ink-soft);
}

.progress-track {
  flex: 1;
  height: 6px;
  background: rgba(25,66,46,0.12);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green-700), var(--gold-500));
  transition: width 0.4s ease;
}

.content-scroll {
  flex: 1;
  padding: 40px 48px 80px;
  max-width: 900px;
}

@media (max-width: 860px) {
  .app-shell { grid-template-columns: 1fr; }
  .trail-rail { display: none; }
  .content-scroll { padding: 28px 20px 60px; }
}

/* ---------- Panels & cards ---------- */

.panel {
  animation: fadeUp 0.35s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .panel { animation: none; }
}

.eyebrow {
  display: inline-block;
  font-size: 0.72rem;
  color: var(--green-700);
  background: var(--green-100);
  border: 1px solid rgba(25,66,46,0.18);
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 14px;
  font-weight: 600;
}

.field-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  box-shadow: var(--shadow-card);
  padding: 22px 24px;
  margin: 18px 0;
}

.field-card.tinted { background: var(--green-100); border-color: rgba(25,66,46,0.2); }
.field-card.gold-tinted { background: var(--gold-200); border-color: rgba(185,154,46,0.35); }

.hero-figure {
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  overflow: hidden;
  box-shadow: var(--shadow-card);
  margin: 18px 0;
}
.hero-figure img { display: block; width: 100%; height: auto; }
.hero-figure figcaption {
  padding: 8px 14px;
  font-size: 0.8rem;
  color: var(--ink-soft);
  background: var(--parchment-dark);
  border-top: 1px solid var(--line);
}

.figure-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin: 16px 0;
}
.figure-row figure { margin: 0; }
.figure-row img {
  width: 100%; height: 150px; object-fit: cover;
  border-radius: var(--radius-s);
  border: 1px solid var(--line);
}
.figure-row figcaption { font-size: 0.76rem; color: var(--ink-soft); margin-top: 6px; }

/* ---------- Flip / definition cards ---------- */

.def-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 14px;
  margin: 18px 0;
}

.flip-card {
  perspective: 1200px;
  height: 175px;
}
.flip-card-inner {
  position: relative;
  width: 100%; height: 100%;
  transition: transform 0.55s cubic-bezier(.2,.8,.2,1);
  transform-style: preserve-3d;
}
.flip-card.is-flipped .flip-card-inner { transform: rotateY(180deg); }
.flip-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  border-radius: var(--radius-m);
  border: 1px solid var(--line);
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.flip-front {
  background: var(--green-700);
  color: var(--parchment);
  cursor: pointer;
  text-align: center;
}
.flip-front .flip-hint { font-size: 0.7rem; color: var(--gold-200); margin-top: 8px; }
.flip-back {
  background: #fff;
  transform: rotateY(180deg);
  font-size: 0.86rem;
  color: var(--ink);
}
.flip-back strong { color: var(--green-700); }

/* ---------- HIPPO cards ---------- */

.hippo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 12px;
  margin: 16px 0;
}
.hippo-card {
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  padding: 14px 16px;
  background: #fff;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.hippo-letter {
  font-family: var(--serif);
  font-size: 1.6rem;
  color: #fff;
  background: var(--clay);
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.hippo-card h4 { margin: 0 0 4px; font-size: 0.95rem; }
.hippo-card p { margin: 0; font-size: 0.85rem; color: var(--ink-soft); }

/* ---------- Zone stepper (tabs) ---------- */

.zone-tabs {
  display: flex;
  gap: 8px;
  margin: 18px 0 0;
  flex-wrap: wrap;
}
.zone-tab {
  border: 1px solid var(--line);
  background: var(--parchment-dark);
  color: var(--ink-soft);
  padding: 9px 16px;
  border-radius: 20px 20px 0 0;
  font-size: 0.85rem;
  font-weight: 600;
}
.zone-tab.is-active { background: #fff; color: var(--green-700); border-bottom-color: #fff; }
.zone-tab.is-visited::after { content: " \2713"; color: var(--gold-600); }
.zone-panel {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 0 var(--radius-m) var(--radius-m) var(--radius-m);
  padding: 20px;
  margin-top: -1px;
}

/* ---------- Before/after slider ---------- */

.compare-wrap {
  position: relative;
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  overflow: hidden;
  box-shadow: var(--shadow-card);
  margin: 18px 0 6px;
  aspect-ratio: 16 / 9.4;
  max-width: 100%;
  user-select: none;
}
.compare-wrap img {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
  display: block;
  pointer-events: none;
}
.compare-after { clip-path: inset(0 0 0 50%); }
.compare-handle-row {
  position: absolute; inset: 0;
  display: flex; align-items: center;
}
.compare-divider {
  position: absolute;
  top: 0; bottom: 0;
  left: 50%;
  width: 3px;
  background: var(--gold-500);
  transform: translateX(-50%);
  pointer-events: none;
}
.compare-tag {
  position: absolute;
  top: 10px;
  padding: 3px 10px;
  font-size: 0.72rem;
  font-weight: 700;
  border-radius: 3px;
  color: #fff;
  letter-spacing: 0.03em;
}
.compare-tag.before-tag { left: 10px; background: var(--water); }
.compare-tag.after-tag { right: 10px; background: var(--clay); }
.compare-slider {
  width: 100%;
  margin: 10px 0 0;
  accent-color: var(--gold-600);
}
.compare-caption { font-size: 0.8rem; color: var(--ink-soft); text-align: center; }

.stat-callout {
  display: flex;
  gap: 16px;
  align-items: center;
  background: var(--green-900);
  color: var(--parchment);
  border-radius: var(--radius-m);
  padding: 18px 22px;
  margin: 18px 0;
}
.stat-callout .stat-num {
  font-family: var(--serif);
  font-size: 2.4rem;
  color: var(--gold-500);
  line-height: 1;
}
.stat-callout .stat-text { font-size: 0.88rem; color: rgba(242,238,225,0.85); }
.stat-callout .stat-text cite { font-style: normal; opacity: 0.7; font-size: 0.78rem; display:block; margin-top:4px;}

/* ---------- Quiz ---------- */

.quiz-q { margin-bottom: 26px; }
.quiz-prompt { font-weight: 600; margin-bottom: 10px; }
.quiz-options { display: flex; flex-direction: column; gap: 8px; }
.quiz-option {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: var(--radius-s);
  padding: 10px 14px;
  text-align: left;
  font-size: 0.92rem;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 10px;
}
.quiz-option:hover:not(:disabled) { border-color: var(--green-500); }
.quiz-option .opt-marker {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid var(--line);
  flex-shrink: 0;
}
.quiz-option.is-correct { background: var(--green-100); border-color: var(--green-700); }
.quiz-option.is-correct .opt-marker { background: var(--green-700); border-color: var(--green-700); }
.quiz-option.is-incorrect { background: var(--clay-light); border-color: var(--clay); }
.quiz-option.is-incorrect .opt-marker { background: var(--clay); border-color: var(--clay); }
.quiz-option:disabled { cursor: default; }

.feedback-box {
  margin-top: 10px;
  padding: 12px 14px;
  border-radius: var(--radius-s);
  font-size: 0.87rem;
  border-left: 4px solid var(--green-700);
  background: var(--green-100);
}
.feedback-box.is-wrong { border-left-color: var(--clay); background: var(--clay-light); }
.feedback-box strong { display: block; margin-bottom: 3px; font-family: var(--serif); }

/* ---------- Multi-select / ranking (decision task) ---------- */

.select-list { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.select-item {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: var(--radius-s);
  padding: 12px 14px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  font-size: 0.9rem;
}
.select-item input[type=checkbox] { margin-top: 3px; accent-color: var(--green-700); width: 16px; height: 16px; }
.select-item.chosen-correct { background: var(--green-100); border-color: var(--green-700); }
.select-item.chosen-incorrect { background: var(--clay-light); border-color: var(--clay); }
.select-item.missed { border-color: var(--gold-600); background: var(--gold-200); }

/* ---------- Form elements ---------- */

textarea {
  width: 100%;
  min-height: 110px;
  font-family: var(--sans);
  font-size: 0.94rem;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-s);
  resize: vertical;
  background: #fffdf8;
}
textarea:focus, button:focus-visible, .quiz-option:focus-visible {
  outline: 3px solid var(--water);
  outline-offset: 1px;
}

.word-count { font-size: 0.76rem; color: var(--ink-soft); margin-top: 4px; text-align: right; }

.rubric-list { list-style: none; padding: 0; margin: 10px 0 0; }
.rubric-list li {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.85rem; padding: 5px 0;
}
.rubric-list .check {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--green-700); flex-shrink: 0;
}

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: none;
  padding: 11px 22px;
  border-radius: 24px;
  font-size: 0.92rem;
  font-weight: 600;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.btn-primary { background: var(--green-700); color: #fff; }
.btn-primary:hover { background: var(--green-900); }
.btn-secondary { background: #fff; color: var(--green-700); border: 1px solid var(--green-700); }
.btn-secondary:hover { background: var(--green-100); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }

/* ---------- Reflection block ---------- */

.reflect-block { margin-bottom: 28px; }
.reflect-prompt { font-weight: 600; margin-bottom: 8px; }
.reflect-nudge {
  margin-top: 8px;
  font-size: 0.83rem;
  color: var(--green-700);
  background: var(--green-100);
  border-radius: var(--radius-s);
  padding: 8px 12px;
  display: none;
}
.reflect-nudge.is-shown { display: block; }

/* ---------- Completion screen ---------- */

.score-ring {
  width: 140px; height: 140px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 18px;
  background: conic-gradient(var(--gold-500) calc(var(--pct, 0) * 1%), var(--green-100) 0);
}
.score-ring-inner {
  width: 112px; height: 112px;
  border-radius: 50%;
  background: #fff;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.score-ring-inner .num { font-family: var(--serif); font-size: 1.9rem; color: var(--green-900); }
.score-ring-inner .lbl { font-size: 0.7rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; }

.status-pill {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.03em;
}
.status-pill.passed { background: var(--green-100); color: var(--green-900); }
.status-pill.failed { background: var(--clay-light); color: var(--clay); }

.resource-list { list-style: none; padding: 0; margin: 10px 0 0; }
.resource-list li {
  padding: 8px 0; border-bottom: 1px dashed var(--line);
  font-size: 0.88rem; color: var(--ink-soft);
}

/* utility */
.small-muted { font-size: 0.8rem; color: var(--ink-soft); }
.center { text-align: center; }
.mt-0 { margin-top: 0; }

</style>
</head>
<body>

<script>
/* ============================================================
   SCORM 1.2 API WRAPPER (hardened, cross-origin safe)
   Panther Corridors GIS Field Simulation
   David Green / CQI360 — LASER SCORM conventions
   ============================================================
   Walks the frame/opener chain to locate the LMS API object,
   catching cross-origin access errors at every hop. Falls back
   to a local "Preview Mode" stub (backed by localStorage) when
   no LMS API is found, so the simulation is fully testable
   outside of Canvas.
   ============================================================ */

(function (global) {
  "use strict";

  var MAX_FRAME_HOPS = 500;
  var api = null;
  var apiFound = false;
  var initialized = false;
  var previewMode = false;
  var PREVIEW_KEY = "panther_gis_lab_preview_cmi";

  function findAPIInWindow(win) {
    var attempts = 0;
    var target = win;
    while (target && attempts < MAX_FRAME_HOPS) {
      try {
        if (target.API) return target.API;
      } catch (e) { /* cross-origin: keep walking */ }
      try {
        if (target === target.parent) break;
        target = target.parent;
      } catch (e) {
        break;
      }
      attempts++;
    }
    return null;
  }

  function findAPI() {
    var found = null;
    try { found = findAPIInWindow(global); } catch (e) {}
    if (!found) {
      try {
        if (global.opener) found = findAPIInWindow(global.opener);
      } catch (e) {}
    }
    // A handful of LMSes (including some Canvas launch wrappers) put the
    // API on top rather than a strict parent chain — check as a last resort.
    if (!found) {
      try { if (global.top && global.top.API) found = global.top.API; } catch (e) {}
    }
    return found;
  }

  function makePreviewStub() {
    previewMode = true;
    var store;
    try {
      store = JSON.parse(localStorage.getItem(PREVIEW_KEY) || "{}");
    } catch (e) {
      store = {};
    }
    function persist() {
      try { localStorage.setItem(PREVIEW_KEY, JSON.stringify(store)); } catch (e) {}
    }
    return {
      LMSInitialize: function () { return "true"; },
      LMSFinish: function () { persist(); return "true"; },

        state.current = Math.min(idx, state.unlocked);
      }
    }
  }

  function persist() {
    Scorm.setSuspendData({
      u: state.unlocked,
      e: state.ecologyChecks,
      z: state.zoneChecks,
      r: state.riverCheckDone,
      dc: state.decisionConceptDone,

  function wireQuiz(root, key, onCorrectFirstTime) {
    var block = root.querySelector('[data-quiz-block="' + key + '"]');
    if (!block) return;
    Array.prototype.forEach.call(block.querySelectorAll("[data-qopt]"), function (btn) {
      btn.addEventListener("click", function () {
        var parts = btn.getAttribute("data-qopt").split(":");
        var oi = parseInt(parts[1], 10);
        if (scratchAnswers[key] != null) return;
        scratchAnswers[key] = oi;
        if (onCorrectFirstTime) {
          onCorrectFirstTime(); // callback is responsible for re-rendering via refreshNav()
        } else {
          renderers[SECTIONS[state.current].id](document.getElementById("sectionRoot"));
        }
      });
    });
  }

  function renderTF(key, check) {
    var answered = scratchAnswers[key] != null;
    var mk = function (val, label) {
      var cls = "quiz-option";
      if (answered) {
        var isRight = val === check.answer;
        if (isRight) cls += " is-correct";
        else if (scratchAnswers[key] === val) cls += " is-incorrect";
      }
      return '<button class="' + cls + '" data-tfopt="' + key + ":" + val + '" ' + (answered ? "disabled" : "") + '><span class="opt-marker"></span>' + label + "</button>";
    };
    var feedback = "";
    if (answered) {
      var correct = scratchAnswers[key] === check.answer;
      feedback = '<div class="feedback-box' + (correct ? "" : " is-wrong") + '"><strong>' + (correct ? "Correct." : "Not quite.") + "</strong>" + esc(check.answer ? check.feedbackTrue : check.feedbackFalse) + "</div>";
    }
    return (
      '<div class="field-card" data-quiz-block="' + key + '">' +
        '<div class="quiz-prompt">' + esc(check.prompt) + "</div>" +
        '<div class="quiz-options">' + mk(true, "True") + mk(false, "False") + "</div>" +
        feedback +
      "</div>"
    );
  }

  function wireTF(root, key, check, onFirstAnswer) {
    var block = root.querySelector('[data-quiz-block="' + key + '"]');
    if (!block) return;
    Array.prototype.forEach.call(block.querySelectorAll("[data-tfopt]"), function (btn) {
      btn.addEventListener("click", function () {
        if (scratchAnswers[key] != null) return;
        var parts = btn.getAttribute("data-tfopt").split(":");
        scratchAnswers[key] = parts[1] === "true";
        if (onFirstAnswer) {
          onFirstAnswer(scratchAnswers[key] === check.answer); // callback re-renders via refreshNav()
        } else {
          renderers[SECTIONS[state.current].id](document.getElementById("sectionRoot"));
        }
      });
    });
  }

  /* ---------- nav row ---------- */

  function navRow(showBack, canAdvance) {
    var isLast = state.current === SECTIONS.length - 1;
    return (
      '<div class="btn-row">' +
        (showBack && state.current > 0 ? '<button class="btn btn-secondary" id="backBtn">\u2190 Back</button>' : "") +
        (!isLast ? '<button class="btn btn-primary" id="nextBtn" ' + (canAdvance ? "" : "disabled") + ">Continue \u2192</button>" : "") +
      "</div>"
    );
  }

  function wireNav(root) {
    var back = document.getElementById("backBtn");
    if (back) back.addEventListener("click", function () { goTo(state.current - 1); });
    var next = document.getElementById("nextBtn");
    if (next) next.addEventListener("click", function () { unlockThrough(state.current + 1); nextSection(); });
  }

  function refreshNav(root) {
    // Re-render current section to update the Continue button's disabled state.
    var sectionId = SECTIONS[state.current].id;
    renderers[sectionId](root);
  }

  /* ---------- boot ---------- */

  function renderAll() {
    renderShell();
    var sectionRoot = document.getElementById("sectionRoot");
    renderers[SECTIONS[state.current].id](sectionRoot);
  }

  function boot() {
    Scorm.init();
    loadState();
    renderAll();
    window.addEventListener("beforeunload", function () {
      persist();
      Scorm.finish();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
